aid: codewisp
name: Codewisp
description: >-
  Codewisp is an AI-powered game creation platform that lets anyone build and
  publish real web games from natural-language prompts, with no coding or
  game-development tools required. Users describe the game they want and the
  platform generates the code, structure, and assets automatically, supporting
  2D, 3D, and multiplayer browser games with instant, prompt-driven refinement.
  Founded by game developer Elvin Fu and part of Y Combinator's Winter 2026
  batch, Codewisp reports 2,000+ weekly active creators and 17,000+ games
  created, offering a browser-based block editor, a community explore and
  marketplace surface, and shareable instant-play links. Codewisp is a consumer
  creation product and does not currently publish a public developer API.
